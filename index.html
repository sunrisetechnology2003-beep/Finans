<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="description" content="VAULT OS — персональный финансовый трекер: доходы, расходы, кредиты, цели и рейтинг под контролем.">
    <title>VAULT OS</title>
    <style>
        :root {
            --bg: #0A0A0A; --card: #1C1C1E; --card-hover: #252528; --card2: #2C2C2E;
            --text: #FFFFFF; --sub: #8E8E93; --green: #34C759; --red: #FF453A;
            --blue: #0A84FF; --purple: #AF52DE; --orange: #FF9F0A; --gold: #E8C36A;
            --glass-border: rgba(255,255,255,0.08);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000; color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            user-select: none; -webkit-user-select: none;
            -webkit-font-smoothing: antialiased; overflow: hidden;
        }
        .app {
            width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; background: var(--bg);
            position: relative; overflow: hidden;
            box-shadow: 0 0 80px rgba(100,108,255,0.06);
        }
        .header {
            padding: calc(var(--safe-top) + 20px) 20px 14px; display: flex; justify-content: space-between;
            align-items: center; z-index: 20; background: rgba(10,10,10,0.85);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.04); flex-shrink: 0;
        }
        .header-title {
            font-size: 24px; font-weight: 800; letter-spacing: -0.6px;
            background: linear-gradient(135deg, #FFFFFF 0%, #B9BEC7 55%, #7C828C 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; line-height: 1.2; display: flex; align-items: center; gap: 6px;
        }
        .header-title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); -webkit-text-fill-color: var(--green); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%; background: var(--card);
            border: 1px solid var(--glass-border); display: flex; align-items: center;
            justify-content: center; font-size: 16px; cursor: pointer;
            transition: var(--transition); color: var(--text); flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.90); background: var(--card-hover); }
        .content {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 20px 0;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .content::-webkit-scrollbar { display: none; }
        .content-bottom-spacer { height: 120px; flex-shrink: 0; }
        .screen { display: none; animation: fadeSlideIn 0.35s cubic-bezier(0.25,0.8,0.25,1); width: 100%; }
        .screen.active { display: block; }
        @keyframes fadeSlideIn {
            from { opacity:0; transform: translateY(10px); }
            to { opacity:1; transform: translateY(0); }
        }
        .balance-card {
            background: linear-gradient(150deg, #1E1E21 0%, #17171A 60%, #121214 100%);
            border-radius: 26px; padding: 26px 22px; margin: 12px 0 16px;
            border: 1px solid rgba(255,255,255,0.07); position: relative;
            overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .balance-card::after {
            content: ""; position: absolute; top: -60px; right: -40px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(120,150,255,0.10) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .balance-card::before {
            content: ""; position: absolute; bottom: -80px; left: -30px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(232,195,106,0.06) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .balance-label {
            font-size: 11px; color: var(--sub); text-transform: uppercase;
            letter-spacing: 1.5px; margin-bottom: 6px; position: relative;
            z-index: 1; font-weight: 600; display: flex; align-items: center; gap: 6px;
        }
        .balance-amount {
            font-size: 40px; font-weight: 800; letter-spacing: -1.5px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative; z-index: 1; line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .balance-details {
            display: flex; justify-content: space-between; margin-top: 20px;
            position: relative; z-index: 1; gap: 4px; padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .detail-item { text-align: center; flex: 1; min-width: 0; }
        .detail-value { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .detail-value.success { color: var(--green); }
        .detail-value.warning { color: var(--orange); }
        .detail-label {
            font-size: 10px; color: var(--sub); margin-top: 3px;
            letter-spacing: 0.4px; text-transform: uppercase; font-weight: 600;
        }
        .safe-banner {
            border-radius: 16px; padding: 14px 16px; display: flex;
            align-items: center; justify-content: space-between; margin-bottom: 14px;
            background: rgba(52,199,89,0.07); border: 1px solid rgba(52,199,89,0.16);
            transition: var(--transition);
        }
        .safe-banner.warning-bg { background: rgba(255,159,10,0.07); border-color: rgba(255,159,10,0.16); }
        .safe-banner.danger-bg { background: rgba(255,69,58,0.07); border-color: rgba(255,69,58,0.16); }
        .safe-text { font-size: 13px; font-weight: 500; color: var(--sub); }
        .safe-amount { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
        .safe-amount.green { color: var(--green); }
        .safe-amount.orange { color: var(--orange); }
        .safe-amount.red { color: var(--red); }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin: 22px 0 10px;
        }
        .section-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
        .section-link {
            font-size: 13px; color: var(--blue); cursor: pointer; font-weight: 600;
            padding: 4px 8px; border-radius: 6px;
        }
        .section-link:active { opacity: 0.6; }
        .list-item {
            background: var(--card); border-radius: 16px; padding: 14px 16px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; border: 1px solid transparent;
            transition: var(--transition); cursor: pointer; width: 100%;
            overflow: hidden; position: relative;
        }
        .list-item:active { background: var(--card-hover); transform: scale(0.99); }
        .list-item.list-item-block { flex-direction: column; align-items: flex-start; gap: 8px; }
        .list-left {
            display: flex; align-items: center; gap: 12px;
            flex: 1; min-width: 0; overflow: hidden;
        }
        .list-icon {
            width: 38px; height: 38px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 16px;
            background: var(--card2); flex-shrink: 0;
        }
        .list-info { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .list-name {
            font-weight: 600; font-size: 14px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .list-date {
            font-size: 11px; color: var(--sub); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .list-amount {
            font-weight: 700; font-size: 14px; text-align: right;
            flex-shrink: 0; margin-left: 10px; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .list-amount.positive { color: var(--green); }
        .list-amount.negative { color: var(--red); }
        .list-amount.pending { color: var(--orange); }
        .list-delete {
            color: var(--red); font-size: 14px; margin-left: 8px; flex-shrink: 0;
            opacity: 0.55; padding: 4px; z-index: 2; cursor: pointer;
        }
        .list-delete:active { opacity: 1; transform: scale(1.2); }
        .list-delete-top {
            position: absolute; top: 10px; right: 10px; color: var(--red);
            font-size: 14px; opacity: 0.55; padding: 4px; z-index: 2; cursor: pointer;
        }
        .list-delete-top:active { opacity: 1; transform: scale(1.2); }
        .btn {
            border: none; padding: 14px 20px; border-radius: 16px;
            font-weight: 700; font-size: 14px; cursor: pointer;
            transition: var(--transition); width: 100%; text-align: center;
            letter-spacing: 0.2px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg,#FFFFFF,#E4E4E6); color: #0A0A0A; box-shadow: 0 4px 14px rgba(255,255,255,0.08); }
        .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--glass-border); }
        .btn-sm {
            padding: 10px 14px; font-size: 12px; width: auto;
            border-radius: 20px; white-space: nowrap; font-weight: 600;
        }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .btn-row .btn { flex: 1; min-width: 0; }
        .progress-bar {
            height: 6px; background: var(--card2); border-radius: 10px;
            overflow: hidden; width: 100%;
        }
        .progress-fill {
            height: 100%; background: var(--blue); border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.25,0.8,0.25,1);
        }
        .progress-fill.green { background: var(--green); }
        .progress-fill.purple { background: var(--purple); }
        .progress-fill.orange { background: var(--orange); }
        .score-circle {
            width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--card2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; font-size: 30px; font-weight: 800;
            transition: border-color 0.4s ease, color 0.4s ease;
            font-variant-numeric: tabular-nums;
        }
        .score-circle.good { border-color: var(--green); color: var(--green); }
        .score-circle.medium { border-color: var(--orange); color: var(--orange); }
        .score-circle.bad { border-color: var(--red); color: var(--red); }
        .score-label { text-align: center; color: var(--sub); font-size: 12px; margin-bottom: 16px; }
        .achievement-card {
            background: var(--card); border-radius: 16px; padding: 14px 16px;
            display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
            border: 1px solid var(--glass-border); width: 100%;
            transition: var(--transition);
        }
        .achievement-card.just-unlocked { border-color: rgba(232,195,106,0.5); box-shadow: 0 0 0 1px rgba(232,195,106,0.2), 0 8px 20px rgba(232,195,106,0.08); }
        .achievement-icon { font-size: 32px; flex-shrink: 0; }
        .achievement-info { flex: 1; min-width: 0; }
        .achievement-info h4 { font-size: 14px; font-weight: 700; }
        .achievement-info p { font-size: 11px; color: var(--sub); margin-top: 1px; }
        .achievement-locked { opacity: 0.35; filter: grayscale(100%); }
        .achievement-status { font-size: 20px; flex-shrink: 0; }
        .buy-result {
            text-align: center; padding: 20px 16px; background: var(--card);
            border-radius: 16px; margin-top: 14px; border: 1px solid var(--glass-border);
            animation: fadeSlideIn 0.3s ease;
        }
        .buy-result .emoji { font-size: 40px; margin-bottom: 8px; }
        .buy-result h3 { font-size: 18px; margin-bottom: 4px; font-weight: 700; }
        .buy-result p { font-size: 13px; color: var(--sub); line-height: 1.4; }
        .empty-state { text-align: center; padding: 30px 16px; color: var(--sub); }
        .empty-state .empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.5; }
        .empty-state p { font-size: 13px; line-height: 1.5; }
        .info-box {
            background: rgba(10,132,255,0.08); border: 1px solid rgba(10,132,255,0.16);
            border-radius: 16px; padding: 12px 14px; margin-bottom: 14px;
            font-size: 13px; color: var(--text); line-height: 1.5;
        }
        .info-box strong { color: var(--blue); }
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 430px;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; align-items: flex-start;
            padding: 8px 0 calc(var(--safe-bottom) + 4px); z-index: 100;
        }
        .nav-item {
            color: var(--sub); font-size: 10px; font-weight: 600; text-align: center;
            cursor: pointer; transition: var(--transition); display: flex;
            flex-direction: column; align-items: center; gap: 3px;
            padding: 4px 10px; border-radius: 10px;
        }
        .nav-item .nav-icon { font-size: 20px; transition: var(--transition); }
        .nav-item.active { color: #FFFFFF; }
        .nav-item.active .nav-icon { transform: translateY(-1px) scale(1.08); }
        .nav-item:active .nav-icon { transform: scale(0.88); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 200; display: flex; align-items: flex-end; justify-content: center;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal-overlay.closing { animation: fadeOut 0.3s ease forwards; }
        @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
        .modal-sheet {
            background: #1C1C1E; width: 100%; max-width: 430px;
            border-radius: 24px 24px 0 0;
            padding: 12px 20px calc(20px + var(--safe-bottom));
            max-height: 85vh; overflow-y: auto;
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
        }
        .modal-sheet.swiping { transition: none; }
        .modal-sheet.closing {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.55, 0, 1, 0.45);
        }
        .modal-drag-handle {
            position: sticky; top: 0; z-index: 10;
            background: #1C1C1E; padding: 4px 0 12px; margin: 0 0 4px;
            display: flex; justify-content: center;
            cursor: grab; touch-action: none;
        }
        .modal-drag-handle-bar {
            width: 36px; height: 5px; background: #55555A;
            border-radius: 3px; opacity: 0.8;
            transition: opacity 0.2s, transform 0.2s;
        }
        .modal-drag-handle:active .modal-drag-handle-bar { opacity: 1; transform: scaleX(1.2); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; letter-spacing: -0.3px; }
        .modal-body-content { touch-action: pan-y; }
        .input-group { margin-bottom: 12px; }
        .input-group label {
            display: block; font-size: 12px; color: var(--sub);
            margin-bottom: 4px; font-weight: 600;
        }
        .input-error { border-color: var(--red) !important; box-shadow: 0 0 0 3px rgba(255,69,58,0.12) !important; }
        input, select {
            width: 100%; background: #2C2C2E; border: 1px solid #3A3A3C;
            border-radius: 12px; padding: 12px 14px; color: #FFFFFF;
            font-size: 15px; font-family: inherit; transition: var(--transition);
            outline: none; -webkit-appearance: none; appearance: none;
        }
        input:focus, select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(10,132,255,0.12);
        }
        select {
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238E8E93' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat; background-position: right 14px center;
            padding-right: 36px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .btn { flex: 1; }
        .toast {
            position: fixed; top: calc(var(--safe-top) + 56px); left: 50%; transform: translateX(-50%);
            background: #2C2C2E; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 600; z-index: 300;
            animation: toastIn 0.35s ease, toastOut 0.3s ease 1.8s forwards;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            max-width: 90%; overflow: hidden; text-overflow: ellipsis;
        }
        .toast.achievement { border-color: rgba(232,195,106,0.4); background: linear-gradient(135deg,#2C2C2E,#26231A); }
        @keyframes toastIn {
            from { opacity:0; transform: translateX(-50%) translateY(-16px); }
            to { opacity:1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut {
            from { opacity:1; }
            to { opacity:0; transform: translateX(-50%) translateY(-16px); }
        }
        .text-center { text-align: center; }
        .text-sub { color: var(--sub); }
        .text-sm { font-size: 11px; }
        .mb-2 { margin-bottom: 8px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="header">
        <div class="header-title"><span class="dot"></span>VAULT OS</div>
        <div class="header-actions">
            <button class="icon-btn" id="btnAddIncome" title="Добавить доход" aria-label="Добавить доход">💸</button>
            <button class="icon-btn" id="btnAddExpense" title="Добавить расход" aria-label="Добавить расход">➕</button>
        </div>
    </div>
    <div class="content" id="appContent"></div>
    <div class="content-bottom-spacer"></div>
    <div class="bottom-nav">
        <div class="nav-item active" data-screen="dashboard"><span class="nav-icon">🏠</span>Главная</div>
        <div class="nav-item" data-screen="money"><span class="nav-icon">💰</span>Деньги</div>
        <div class="nav-item" data-screen="analytics"><span class="nav-icon">📊</span>Аналитика</div>
        <div class="nav-item" data-screen="goals"><span class="nav-icon">🎯</span>Цели</div>
        <div class="nav-item" data-screen="achievements"><span class="nav-icon">🏆</span>Успехи</div>
    </div>
</div>

<script>
(function() {
'use strict';

const STORAGE_KEY = 'vaultOS';
const LEVELS = ['Новичок','Контролёр','Стратег','Мастер','Финансовая свобода'];

const DEFAULT_DATA = {
    incomes: [
        { id: 1, source: 'Зарплата (5 число)', amount: 70000, date: '2026-08-05', category: 'salary', comment: '' },
        { id: 2, source: 'Зарплата (20 число)', amount: 70000, date: '2026-08-20', category: 'salary', comment: '' }
    ],
    credits: [
        { id: 1, name: 'Кредит авто', totalDebt: 860000, rate: 0.12, termMonths: 24, monthlyPayment: 43000, paymentDay: 10, startDate: '2025-01-10', comment: '' }
    ],
    mandatory: [
        { id: 2, name: 'Бензин', amount: 10000, date: '2026-08-07', category: 'transport' },
        { id: 3, name: 'Интернет + Связь', amount: 1500, date: '2026-08-15', category: 'utilities' },
        { id: 4, name: 'Подписки', amount: 1200, date: '2026-08-12', category: 'subscriptions' }
    ],
    expenses: [
        { id: 1, amount: 1200, category: '🍔 Еда', date: '2026-08-02', comment: 'Обед' },
        { id: 2, amount: 3500, category: '🎮 Развлечения', date: '2026-08-03', comment: 'Кино и ужин' },
        { id: 3, amount: 2500, category: '🛒 Покупки', date: '2026-08-01', comment: 'Одежда' }
    ],
    goals: [
        { id: 1, name: 'Финансовая подушка', target: 300000, current: 50000, icon: '🛡️' },
        { id: 2, name: 'Отпуск', target: 150000, current: 30000, icon: '✈️' },
        { id: 3, name: 'Новая техника', target: 80000, current: 15000, icon: '💻' }
    ],
    achievements: { firstReserve: false, monthControl: false, debt50k: false, firstLevel: true },
    financialScore: 50,
    level: 'Новичок'
};

let DB, currentScreen = 'dashboard';

function loadDB() {
    try {
        const s = localStorage.getItem(STORAGE_KEY);
        DB = s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    } catch(e) { DB = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
    // Defensive defaults — guards against partially-corrupt or older saved data
    if (!Array.isArray(DB.incomes)) DB.incomes = [];
    if (!Array.isArray(DB.credits)) DB.credits = [];
    if (!Array.isArray(DB.mandatory)) DB.mandatory = [];
    if (!Array.isArray(DB.expenses)) DB.expenses = [];
    if (!Array.isArray(DB.goals)) DB.goals = [];
    if (!DB.achievements || typeof DB.achievements !== 'object') DB.achievements = { firstReserve:false, monthControl:false, debt50k:false, firstLevel:true };
    if (typeof DB.financialScore !== 'number') DB.financialScore = 50;
    if (!DB.level) DB.level = 'Новичок';
    saveDB();
}
function saveDB() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e) { /* storage unavailable — app still works in-memory for this session */ } }
function getToday() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(n) {
    const v = Math.round(Number(n) || 0);
    return v.toLocaleString('ru-RU') + ' ₽';
}
function fmtNum(n) { return Math.round(Number(n) || 0).toLocaleString('ru-RU'); }
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {} }

// ==================== КРЕДИТНЫЙ ДВИЖОК ====================
function getNextCreditPaymentDate(day) {
    const now = new Date();
    const safe = Math.min(Math.max(1, day || 1), 28);
    let pd = new Date(now.getFullYear(), now.getMonth(), safe);
    if (pd <= now) pd = new Date(now.getFullYear(), now.getMonth()+1, safe);
    return pd.getFullYear()+'-'+String(pd.getMonth()+1).padStart(2,'0')+'-'+String(pd.getDate()).padStart(2,'0');
}

function monthsBetween(startDate, endDate) {
    // Whole calendar months elapsed between two dates (never negative)
    let months = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth());
    if (endDate.getDate() < startDate.getDate()) months -= 1;
    return Math.max(0, months);
}

function getCreditProgress(c) {
    const now = new Date();
    const start = new Date(c.startDate);
    const total = Math.max(1, c.termMonths);
    const monthsPassed = monthsBetween(start, now);
    const paid = Math.max(0, Math.min(monthsPassed, total));
    const remainingDebt = Math.max(0, Math.round(c.totalDebt - paid * c.monthlyPayment));
    const remainingMonths = Math.max(0, total - paid);
    const totalInterest = c.totalDebt * (c.rate || 0) * (total/12);
    const extra = 5000;
    const newMonthly = c.monthlyPayment + extra;
    const newRemaining = remainingDebt > 0 ? Math.ceil(remainingDebt / newMonthly) : 0;
    const monthsSaved = Math.max(0, remainingMonths - newRemaining);
    const interestSaved = Math.round(totalInterest * (monthsSaved / total));
    const endDate = new Date(start);
    endDate.setMonth(endDate.getMonth() + total);
    return {
        monthsPaid: paid, remainingDebt, remainingMonths, totalInterest,
        totalPaid: Math.max(0, c.totalDebt - remainingDebt),
        monthsSavedWithExtra: monthsSaved, interestSavedWithExtra: interestSaved,
        nextPaymentDate: getNextCreditPaymentDate(c.paymentDay),
        endDate: endDate.toLocaleDateString('ru-RU', { month:'long', year:'numeric' }),
        progressPercent: Math.min(100, Math.round((paid/total)*100))
    };
}

function getUpcomingCreditPayments() {
    const today = getToday();
    return DB.credits.map(c => {
        const p = getCreditProgress(c);
        return { id: c.id, name: c.name, amount: c.monthlyPayment, date: p.nextPaymentDate, category: 'credit', isCredit: true, progress: p };
    }).filter(p => p.date > today && p.progress.remainingDebt > 0).sort((a,b) => a.date.localeCompare(b.date));
}

// ==================== ФИНАНСОВЫЙ ДВИЖОК ====================
function getBudget() {
    const today = getToday();
    const todayDate = new Date(today);

    // Все доходы по сегодня включительно (в т.ч. добавленные задним числом)
    const totalIncome = DB.incomes
        .filter(i => i.date <= today)
        .reduce((s, i) => s + i.amount, 0);

    // Все расходы по сегодня включительно
    const totalSpent = DB.expenses
        .filter(e => e.date <= today)
        .reduce((s, e) => s + e.amount, 0);

    const balance = totalIncome - totalSpent;

    // Ближайшая будущая зарплата (строго позже сегодня)
    const sortedIncomes = [...DB.incomes].sort((a, b) => a.date.localeCompare(b.date));
    const futureSalary = sortedIncomes.find(i => i.date > today);

    // Предстоящие обязательные платежи (строго позже сегодня)
    const upcomingMandatory = DB.mandatory
        .filter(p => p.date > today)
        .reduce((s, p) => s + p.amount, 0);

    const upcomingCredit = getUpcomingCreditPayments()
        .reduce((s, p) => s + p.amount, 0);

    if (!futureSalary) {
        const upcomingTotal = upcomingMandatory + upcomingCredit;
        return {
            balance, free: balance - upcomingTotal, safe: 0,
            days: '—', nextDate: null, upcoming: upcomingTotal, spent: totalSpent, hasFutureSalary: false
        };
    }

    const days = Math.max(1, Math.ceil((new Date(futureSalary.date) - todayDate) / 86400000));

    // Платежи до следующей зарплаты (строго после today и не позже даты ЗП)
    const paymentsUntilSalary = DB.mandatory
        .filter(p => p.date > today && p.date <= futureSalary.date)
        .reduce((s, p) => s + p.amount, 0) +
        getUpcomingCreditPayments()
        .filter(p => p.date > today && p.date <= futureSalary.date)
        .reduce((s, p) => s + p.amount, 0);

    const free = balance - paymentsUntilSalary;
    const safe = free > 0 ? free / days : 0;

    return {
        balance, free, safe, days,
        nextDate: futureSalary.date, upcoming: paymentsUntilSalary,
        spent: totalSpent, hasFutureSalary: true
    };
}

function getUpcomingPayments() {
    const today = getToday();
    return [
        ...getUpcomingCreditPayments(),
        ...DB.mandatory.filter(p => p.date > today).map(p => ({...p, isCredit: false}))
    ].sort((a, b) => a.date.localeCompare(b.date));
}

function calculateBuy(cost) {
    const b = getBudget();
    const afterAll = b.balance - cost - b.upcoming;
    if (b.free >= cost && afterAll >= 0) return { status:'yes', emoji:'✅', title:'Можно купить', message:'После покупки и всех платежей останется '+fmt(afterAll) };
    if (b.balance >= cost && afterAll < 0) return { status:'wait', emoji:'⚠️', title:'Лучше подождать', message:'После обязательных платежей не хватит '+fmt(Math.abs(afterAll))+'. Дождитесь зарплаты.' };
    return { status:'no', emoji:'❌', title:'Сейчас нельзя', message:'Недостаточно средств.' };
}

function calculateFinancialScoreValue() {
    const b = getBudget();
    let score = 50;
    if (b.free > 0) score += 15;
    if (b.safe > 1000) score += 10;
    const totalDebt = DB.credits.reduce((s,c) => s+getCreditProgress(c).remainingDebt,0);
    const totalIncome = DB.incomes.reduce((s,i) => s+i.amount,0);
    if (totalIncome > 0 && totalDebt < totalIncome*3) score += 10;
    const rg = DB.goals.find(g => g.name.toLowerCase().includes('подушка'));
    if (rg && rg.current > 50000) score += 10;
    if (!b.hasFutureSalary && b.free < 0) score -= 15;
    return Math.min(100, Math.max(0, Math.round(score)));
}

function levelForScore(score) {
    if (score >= 90) return LEVELS[4];
    if (score >= 75) return LEVELS[3];
    if (score >= 50) return LEVELS[2];
    if (score >= 25) return LEVELS[1];
    return LEVELS[0];
}

// Recomputes score, level and achievement unlocks from current data.
// Returns the list of achievement keys that were newly unlocked this call.
function refreshProgress() {
    const score = calculateFinancialScoreValue();
    DB.financialScore = score;
    DB.level = levelForScore(score);

    const a = DB.achievements;
    const newlyUnlocked = [];
    const unlock = (key, condition) => {
        if (condition && !a[key]) { a[key] = true; newlyUnlocked.push(key); }
    };

    const reserve = DB.goals.find(g => g.name.toLowerCase().includes('подушка'));
    unlock('firstReserve', !!reserve && reserve.current >= 10000);

    const b = getBudget();
    unlock('monthControl', b.hasFutureSalary && b.free >= 0 && score >= 60);

    const totalPaidDebt = DB.credits.reduce((s,c) => s + getCreditProgress(c).totalPaid, 0);
    unlock('debt50k', totalPaidDebt >= 50000);

    unlock('firstLevel', true);

    saveDB();
    return newlyUnlocked;
}

    const leaksHTML = catEntries.length > 0 ? catEntries.map(([cat,amt]) => {
        const pct = totalSpent > 0 ? Math.round(amt/totalSpent*100) : 0;
        return `<div class="list-item list-item-block"><div class="flex-between"><span>${esc(cat)}</span><span class="list-amount negative">${fmt(amt)} (${pct}%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
    }).join('') : '<div class="empty-state"><p>Нет данных по расходам</p></div>';

    let creditHTML = '';
    if (activeCredits.length > 0) {
        creditHTML = `<div class="section-header"><div class="section-title">🏦 Кредитная нагрузка</div></div><div class="list-item list-item-block"><div class="flex-between"><span>Платежи по кредитам</span><span class="list-amount pending">${fmt(totalCreditPayment)}/мес</span></div><div class="flex-between text-sub text-sm"><span>От дохода</span><span>${creditBurden}%</span></div><div class="progress-bar"><div class="progress-fill ${creditBurden>40?'orange':'green'}" style="width:${Math.min(100,creditBurden)}%"></div></div><p class="text-sub text-sm">${creditBurden>40?'⚠️ Высокая нагрузка':'✅ Комфортный уровень'}</p></div>`;
    }

    return `<div class="screen active"><div class="section-title">⭐ Финансовый рейтинг</div><div class="score-circle ${scoreClass}">${score}</div><p class="score-label">Уровень: ${esc(DB.level)}</p><div class="progress-bar mb-2"><div class="progress-fill ${scoreClass}" style="width:${score}%"></div></div><p class="text-center text-sub text-sm">${score>=70?'Отличный контроль!':score>=40?'Есть куда расти':'Требуется внимание'}</p>${creditHTML}<div class="section-header"><div class="section-title">🔍 Утечки денег</div></div>${leaksHTML}<div class="section-header"><div class="section-title">📈 Прогноз к зарплате</div></div><div class="list-item"><span>🌟 Оптимистичный</span><span class="list-amount ${opt>0?'positive':'negative'}">${fmt(opt)}</span></div><div class="list-item"><span>📊 Обычный</span><span class="list-amount ${norm>0?'positive':'negative'}">${fmt(norm)}</span></div><div class="list-item"><span>⚠️ Пессимистичный</span><span class="list-amount ${pes>0?'positive':'negative'}">${fmt(pes)}</span></div><div class="section-header"><div class="section-title">🤖 AI-советник</div></div><div class="safe-banner"><span>${advice}</span></div></div>`;
}

function renderGoals() {
    const goalsHTML = DB.goals.length > 0 ? DB.goals.map(g => {
        const pct = Math.min(100, Math.round((g.current/Math.max(1,g.target))*100));
        return `<div class="list-item list-item-block goal-clickable" data-id="${g.id}"><div class="flex-between"><span style="font-weight:700;">${esc(g.icon||'🎯')} ${esc(g.name)}</span><span>${fmt(g.current)} / ${fmt(g.target)}</span></div><div class="progress-bar"><div class="progress-fill green" style="width:${pct}%"></div></div><div class="flex-between text-sub text-sm"><span>${pct}%</span><span>${pct>=100?'Достигнуто 🎉':'Нажмите, чтобы пополнить'}</span></div><span class="list-delete-top delete-goal" data-id="${g.id}">🗑️</span></div>`;
    }).join('') : '<div class="empty-state"><div class="empty-icon">🎯</div><p>Нет целей</p></div>';

    const reserve = DB.goals.find(g => g.name.toLowerCase().includes('подушка'));
    const expMonths = new Set(DB.expenses.map(e => e.date.slice(0,7))).size;
    const monthlySpend = DB.expenses.length > 0 ? DB.expenses.reduce((s,e) => s+e.amount,0)/Math.max(1,expMonths) : 30000;
    const needed = Math.round(monthlySpend*6);
    const currentReserve = reserve ? reserve.current : 0;
    const reservePct = Math.min(100, Math.round((currentReserve/Math.max(1,needed))*100));

    return `<div class="screen active"><div class="section-header"><div class="section-title">🎯 Цели накоплений</div><button class="btn btn-sm btn-secondary" id="btnAddGoal">+ Цель</button></div>${goalsHTML}<div class="section-header"><div class="section-title">🛡️ Подушка безопасности</div></div><div class="list-item list-item-block"><p class="text-sub text-sm">Рекомендуемый резерв: <strong style="color:var(--text)">${fmt(needed)}</strong> (6 мес. расходов)</p><div class="progress-bar"><div class="progress-fill purple" style="width:${reservePct}%"></div></div><span class="text-sub text-sm">${reservePct}% — ${fmt(currentReserve)}</span></div></div>`;
}

function renderAchievements() {
    const a = DB.achievements;
    const list = Object.keys(ACHIEVEMENT_META).map(key => ({ key, ...ACHIEVEMENT_META[key], unlocked: !!a[key] }));
    const idx = LEVELS.indexOf(DB.level);
    return `<div class="screen active"><div class="section-title">🏆 Достижения</div>${list.map(ach => `<div class="achievement-card ${ach.unlocked?'':'achievement-locked'}"><div class="achievement-icon">${ach.icon}</div><div class="achievement-info"><h4>${esc(ach.title)}</h4><p>${esc(ach.desc)}</p></div><span class="achievement-status">${ach.unlocked?'✅':'🔒'}</span></div>`).join('')}<div class="section-header"><div class="section-title">📈 Уровни</div></div>${LEVELS.map((lvl,i) => `<div class="list-item" style="opacity:${i<=idx?1:0.4};"><span>${i<=idx?'✅':'⬜'} ${lvl}</span>${i===idx?'<span style="color:var(--blue);font-weight:700;">Вы здесь</span>':''}</div>`).join('')}</div>`;
}

function esc(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div'); div.textContent = String(str); return div.innerHTML;
}

function deleteIncome(id) { if (confirm('Удалить этот доход?')) { DB.incomes = DB.incomes.filter(i => i.id !== id); saveDB(); refreshAndRender(); showToast('Доход удалён'); } }
function deleteExpense(id) { if (confirm('Удалить этот расход?')) { DB.expenses = DB.expenses.filter(e => e.id !== id); saveDB(); refreshAndRender(); showToast('Расход удалён'); } }
function deleteMandatory(id) { if (confirm('Удалить платёж?')) { DB.mandatory = DB.mandatory.filter(p => p.id !== id); saveDB(); refreshAndRender(); showToast('Платёж удалён'); } }
function deleteCredit(id) { if (confirm('Удалить кредит?')) { DB.credits = DB.credits.filter(c => c.id !== id); saveDB(); refreshAndRender(); showToast('Кредит удалён'); } }
function deleteGoal(id) { if (confirm('Удалить эту цель?')) { DB.goals = DB.goals.filter(g => g.id !== id); saveDB(); refreshAndRender(); showToast('Цель удалена'); } }
function updateGoal(id) {
    const goal = DB.goals.find(g => g.id === id); if (!goal) return;
    showModal(`Пополнить: ${esc(goal.name)}`,
        `<p class="text-sub text-sm mb-2">Прогресс: ${fmt(goal.current)} из ${fmt(goal.target)}</p><div class="input-group"><label>Сумма (₽)</label><input id="gAdd" type="number" inputmode="numeric" placeholder="5000" autofocus></div>`,
        () => {
            const add = +document.getElementById('gAdd').value;
            if (!add || add <= 0) { markInvalid('gAdd'); return false; }
            goal.current += add; saveDB(); vibrate(15);
            refreshAndRender(); showToast(`+${fmt(add)} к цели «${goal.name}»`);
            return true;
        });
}

function markInvalid(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('input-error');
    el.addEventListener('input', function h() { el.classList.remove('input-error'); el.removeEventListener('input', h); });
    el.focus();
}

// ==================== MODAL ====================
function showModal(title, contentHTML, onSave) {
    const existing = document.querySelector('.modal-overlay');
    if (existing) { existing.remove(); }
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
    const sheet = document.createElement('div'); sheet.className = 'modal-sheet';
    sheet.innerHTML = `
        <div class="modal-drag-handle"><div class="modal-drag-handle-bar"></div></div>
        <div class="modal-title">${title}</div>
        <div class="modal-body-content">${contentHTML}</div>
        <div class="modal-actions">
            <button class="btn btn-secondary cancel-modal" type="button">Отмена</button>
            <button class="btn btn-primary save-modal" type="button">Сохранить</button>
        </div>`;
    overlay.appendChild(sheet); document.body.appendChild(overlay);

    const handle = sheet.querySelector('.modal-drag-handle');
    let startY = 0, currentY = 0, isDragging = false, sheetHeight = 0;
    function getClientY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }
    function onMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();
        currentY = getClientY(e); const delta = currentY - startY;
        if (delta < 0) return;
        sheet.style.transform = `translateY(${delta}px)`;
        overlay.style.background = `rgba(0,0,0,${0.75*(1-Math.min(delta/sheetHeight,1)*0.8)})`;
    }
    function onEnd() {
        if (!isDragging) return;
        isDragging = false; sheet.classList.remove('swiping'); sheet.style.transition = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        const delta = currentY - startY;
        if (delta > sheetHeight*0.25) {
            closeModal(true);
        } else {
            sheet.style.transform = 'translateY(0)';
            overlay.style.background = 'rgba(0,0,0,0.75)';
        }
    }
    function onStart(e) {
        if (!e.target.closest('.modal-drag-handle')) return;
        isDragging = true; startY = getClientY(e); sheetHeight = sheet.offsetHeight;
        sheet.classList.add('swiping'); sheet.style.transition = 'none';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
    }
    handle.addEventListener('touchstart', onStart, { passive: true });
    handle.addEventListener('touchmove', onMove, { passive: false });
    handle.addEventListener('touchend', onEnd);
    handle.addEventListener('touchcancel', onEnd);
    handle.addEventListener('mousedown', onStart);

    function closeModal(animate) {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        if (animate !== false) {
            sheet.classList.add('closing'); overlay.classList.add('closing');
            overlay.style.background = 'rgba(0,0,0,0)';
            setTimeout(() => overlay.remove(), 300);
        } else { overlay.remove(); }
    }
    overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(true); });
    overlay.querySelector('.cancel-modal').addEventListener('click', () => closeModal(true));
    overlay.querySelector('.save-modal').addEventListener('click', () => {
        const result = onSave ? onSave() : true;
        if (result !== false) closeModal(true);
    });
    setTimeout(() => { const fi = sheet.querySelector('input'); if (fi) fi.focus({ preventScroll: true }); }, 400);
}

    setTimeout(() => {
        const pi = document.getElementById('buyPrice');
        if (pi) pi.addEventListener('input', function() {
            const price = +this.value;

            const result = calculateBuy(price);
            preview.innerHTML = `<div class="buy-result"><div class="emoji">${result.emoji}</div><h3>${result.title}</h3><p>${result.message}</p></div>`;
        });
        const btn = document.querySelector('.modal-overlay .save-modal');
        if (btn) btn.textContent = 'Закрыть';
    }, 50);
}

function openAddGoalModal() {
    showModal('Новая цель',

        () => {
            const name = document.getElementById('gName').value.trim() || 'Цель';
            const target = +document.getElementById('gTarget').value;

function showToast(msg, isAchievement) {
    const existing = document.querySelector('.toast'); if (existing) existing.remove();
    const toast = document.createElement('div'); toast.className = 'toast' + (isAchievement ? ' achievement' : ''); toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 2200);
}

function switchScreen(screen) {
    currentScreen = screen;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const nav = document.querySelector(`.nav-item[data-screen="${screen}"]`);
    if (nav) nav.classList.add('active');
    renderCurrentScreen();
    document.getElementById('appContent').scrollTop = 0;
}

function setupGlobalHandlers() {
    document.getElementById('btnAddIncome').addEventListener('click', openAddIncomeModal);
    document.getElementById('btnAddExpense').addEventListener('click', openAddExpenseModal);
    document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', function() { vibrate(8); switchScreen(this.dataset.screen); }));
    document.getElementById('appContent').addEventListener('click', function(e) {
        const t = e.target;
        if (t.id === 'btnQuickExpense') openAddExpenseModal();
        if (t.id === 'btnQuickIncome') openAddIncomeModal();
        if (t.id === 'btnBuyCheck') openBuyCheckModal();
        if (t.id === 'btnAddIncomeScreen') openAddIncomeModal();
        if (t.id === 'btnAddExpenseScreen') openAddExpenseModal();
        if (t.id === 'btnAddMandatory') openAddMandatoryModal();
        if (t.id === 'btnAddCredit') openAddCreditModal();
        if (t.id === 'btnAddGoal') openAddGoalModal();
        if (t.classList.contains('delete-income')) { e.stopPropagation(); deleteIncome(parseInt(t.dataset.id, 10)); }
        if (t.classList.contains('delete-expense')) { e.stopPropagation(); deleteExpense(parseInt(t.dataset.id, 10)); }
        if (t.classList.contains('delete-mandatory')) { e.stopPropagation(); deleteMandatory(parseInt(t.dataset.id, 10)); }
        if (t.classList.contains('delete-credit')) { e.stopPropagation(); deleteCredit(parseInt(t.dataset.id, 10)); }
        if (t.classList.contains('delete-goal')) { e.stopPropagation(); deleteGoal(parseInt(t.dataset.id, 10)); }
        const goalEl = t.classList.contains('goal-clickable') ? t : t.closest('.goal-clickable');
        if (goalEl && !t.classList.contains('delete-goal')) updateGoal(parseInt(goalEl.dataset.id, 10));
    });
}

function init() {
    loadDB();
    refreshProgress();
    setupGlobalHandlers();
    renderCurrentScreen();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
